# T-020 · 第一条验证链：生成工程 → 编译（Debug, simulator）→ 跑 FNPBCoreTests
#
# 设计边界（Kimi 架构约束 + 本卡实现说明）
# - 只在 simulator destination 上构建/测试，不接触真机签名；真机未签名 IPA 由 pipeline/ 负责。
# - 资产：编译不依赖原版美术资源。ContentBundle 缺失必须在运行期降级为占位（T-019 约定）。
#   本仓库注入上下文中未包含 Sources/FNPBCore/Content/*，是否存在编译期资产依赖标 [待验证]
#   → 因此这里只做目录兜底，**不**臆造资源生成步骤。详见 docs/CI_FIRST_BUILD.md §2。
# - 全部 xcodebuild 调用带 -derivedDataPath，产物与日志路径可预测，便于失败收集。
# - 单矩阵（不 matrix），job 级 timeout-minutes: 25。
name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # brew 无版本化 formula：安装后做严格版本断言，漂移即显式失败（见 docs §3.13）
  XCODEGEN_VERSION: "2.46.0"
  PROJECT: FNPIB.xcodeproj
  SCHEME: FNPIB
  DERIVED_DATA: build/DerivedData

jobs:
  build-and-test:
    name: Build & Test (FNPBCoreTests)
    # Xcode 26 所在镜像；若该镜像不含 Xcode 26，改 macos-26（docs §3.1）
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # ------------------------------------------------------------------ 工具链
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          echo "== /Applications 下的 Xcode =="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          pick=""
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            [ -d "$app" ] || continue
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                    "$app/Contents/Info.plist" 2>/dev/null || echo 0)"
            echo "  $app -> $ver"
            case "$ver" in
              26.*) pick="$app" ;;
            esac
          done < <(ls -d /Applications/Xcode*.app 2>/dev/null || true)

          if [ -z "$pick" ]; then
            echo "::error::未找到 Xcode 26.x。project.yml 的 IPHONEOS_DEPLOYMENT_TARGET=26.0 需要 Xcode 26 SDK。请改用含 Xcode 26 的 runner 镜像（如 macos-26），或临时降低部署目标做语法级验证（不要提交该改动）。见 docs/CI_FIRST_BUILD.md §3.1"
            xcodebuild -version || true
            exit 1
          fi

          echo "改用 $pick"
          sudo xcode-select -s "$pick"
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen || true
          got="$(xcodegen --version 2>/dev/null | awk '{print $NF}')"
          echo "xcodegen=${got:-<none>} pinned=$XCODEGEN_VERSION"
          if [ "$got" != "$XCODEGEN_VERSION" ]; then
            echo "::error::XcodeGen 版本漂移：期望 $XCODEGEN_VERSION，实得 ${got:-<none>}。更新 env.XCODEGEN_VERSION，或按 docs/CI_FIRST_BUILD.md §3.13 用固定 release 安装。"
            exit 1
          fi

      # xcpretty 仅用于日志美化；装不上就回落 cat，不影响构建结论
      - name: Install xcpretty (optional)
        continue-on-error: true
        run: |
          gem install xcpretty --no-document --user-install
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------ 资产/目录兜底
      - name: Prepare workspace (asset-independent)
        run: |
          set -euo pipefail
          mkdir -p build "$DERIVED_DATA" Raw

          # 编译期不需要原版美术资源（T-019 ContentBundle 约定运行期降级）。
          # 若未来资产管线改为编译期生成（tools/AssetPipeline 进 Run Script），在下面追加生成步骤。
          ls -la Raw || true

          for d in Sources/FNPBCore Sources/FNPBRender Sources/FNPBRender/Shaders \
                   Sources/FNPBPlatform Sources/FNPBUI App Tests/FNPBCoreTests; do
            if [ -d "$d" ]; then
              echo "ok    $d"
            else
              echo "::warning::$d 缺失：xcodegen 可能生成空 target，编译期会以「找不到类型/符号」的形式暴露（docs §3.2）"
            fi
          done

      # ------------------------------------------------------------------ 生成工程
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project "$PROJECT"

          # 防回归：blueprint 两个 Swift 源必须真的进工程（T-011 约定直编入 FNPBCore）
          for f in Constants.swift GameState.swift; do
            if grep -q "$f" "$PROJECT/project.pbxproj"; then
              echo "ok    $f 已进入工程"
            else
              echo "::warning::$f 未出现在 $PROJECT 中，FNPBCore 会缺类型（docs §3.7）"
            fi
          done

      # ------------------------------------------------------------------ 构建
      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | (xcpretty --color || cat)

      # ------------------------------------------------------------------ 测试
      # 不绑定会随 runner 镜像变化的具体机型；从当前 Xcode 可用设备中选 iPhone。
      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          devices = [device for runtime in sorted(runtimes, reverse=True)
                     for device in runtimes[runtime]
                     if device.get("isAvailable", False) and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("没有可用的 iPhone 模拟器")
          print(devices[0]["udid"])
          ')"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          echo "使用模拟器 UDID: $SIM_ID"

      - name: Test (FNPBCoreTests)
        run: |
          set -o pipefail
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | tee test.log | (xcpretty --test --color || cat)

      # ------------------------------------------------------------------ 失败诊断 + 产物
      - name: Diagnostics (failure only)
        if: failure()
        run: |
          set +e
          echo "== xcodebuild -version =="
          xcodebuild -version
          echo
          echo "== 可用模拟器 =="
          xcrun simctl list devices available | sed -n '1,80p'
          echo
          echo "== xcresult 摘要 =="
          if [ -d build/TestResults.xcresult ]; then
            # Xcode 16+ 子命令形态（首选）
            xcrun xcresulttool get test-results summary \
              --path build/TestResults.xcresult --format json > test-summary.json 2>> xcresult-errors.log
            head -c 4000 test-summary.json 2>/dev/null || true
            if [ ! -s test-summary.json ]; then
              # 旧格式回退 [待验证]
              xcrun xcresulttool get --path build/TestResults.xcresult \
                --format json > xcresult-legacy.json 2>> xcresult-errors.log || true
            fi
          fi
          echo
          echo "== build.log 尾部 =="
          tail -n 120 build.log 2>/dev/null
          echo
          echo "== test.log 尾部 =="
          tail -n 200 test.log 2>/dev/null
          exit 0

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build.log
            test.log
            test-summary.json
            xcresult-legacy.json
            xcresult-errors.log
            build/TestResults.xcresult

      - name: Job summary
        if: always()
        run: |
          {
            echo "## iOS CI (FNPIB)"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| XcodeGen | \`$(xcodegen --version 2>/dev/null | awk '{print $NF}' || echo n/a)\` |"
            echo "| Xcode | \`$(xcodebuild -version 2>/dev/null | tr '\n' ' ')\` |"
            echo "| scheme | \`$SCHEME\` |"
            echo "| destination | \`platform=iOS Simulator,id=${SIM_ID:-unavailable}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
  # ------------------------------------------------------------------ 未签名 IPA
  # 只在 Build & Test 通过后跑，PR 上跳过（PR 只需要编译 + 单测）。
  # 目标：把「能编译」推进到「有一个能侧载的包」，并在打包前校验包内容与架构。
  # 注意：不要用 xcodebuild -exportArchive——它强制签名，与未签名包的目标冲突。
  package-ipa:
    name: Package unsigned IPA
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          pick=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                    "$app/Contents/Info.plist" 2>/dev/null || echo 0)"
            echo "  $app -> $ver"
            case "$ver" in
              26.*) pick="$app" ;;
            esac
          done
          [ -n "$pick" ] || { echo "::error::未找到 Xcode 26.x"; exit 1; }
          sudo xcode-select -s "$pick"
          xcodebuild -version

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen || true
          got="$(xcodegen --version 2>/dev/null | awk '{print $NF}')"
          if [ "$got" != "$XCODEGEN_VERSION" ]; then
            echo "::error::XcodeGen 版本漂移：期望 $XCODEGEN_VERSION，实得 ${got:-<none>}"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          mkdir -p build
          xcodegen generate --spec project.yml

      # Release 是硬要求：Debug 产物带 FNPIB.debug.dylib / __preview.dylib，重签后无法启动
      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FNPIB.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee archive.log | (xcpretty --color || cat)

      - name: Validate bundle
        run: |
          set -euo pipefail
          APP="build/FNPIB.xcarchive/Products/Applications/FNPIB.app"
          [ -d "$APP" ] || { echo "::error::archive 没有产出 FNPIB.app"; exit 1; }

          plist="$APP/Info.plist"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          minos="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || echo '?')"
          echo "exe=$exe  bundle=$bid  minOS=$minos"

          [ "$exe" = "FNPIB" ] || { echo "::error::CFBundleExecutable=$exe"; exit 1; }
          [ "$bid" = "com.example.fnpib" ] || { echo "::error::CFBundleIdentifier=$bid"; exit 1; }
          case "$minos" in
            26.*) ;;
            *) echo "::error::MinimumOSVersion=$minos，期望 26.x（project.yml 的 IPHONEOS_DEPLOYMENT_TARGET）"; exit 1 ;;
          esac

          archs="$(lipo -archs "$APP/$exe")"
          echo "app archs: $archs"
          case "$archs" in
            *arm64*) ;;
            *) echo "::error::主二进制不含 arm64: $archs"; exit 1 ;;
          esac

          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP"/Frameworks/*.framework; do
              [ -d "$fw" ] || continue
              name="$(basename "$fw" .framework)"
              a="$(lipo -archs "$fw/$name" 2>/dev/null || echo '?')"
              echo "framework $name: $a"
              case "$a" in
                *arm64*) ;;
                *) echo "::error::$name 缺 arm64 切片"; exit 1 ;;
              esac
            done
          fi

          # 这 9 个是运行期真正会被读取的资源，缺一个就等于「装上去是空的」
          missing=0
          for f in fruitList.json originalWaveList.json ch1challengeWaveList.json \
                   bonusAwards.json originalModeInfo.json ch1challengeList.json \
                   challengeConditions.json challengeTypes.json challengeMapStrings.json \
                   challengeBackgroundStrings.json artworkManifest.json \
                   bronic.ttf miserable.TTF; do
            if [ ! -f "$APP/$f" ]; then
              echo "::error::包内缺资源 $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "包内容与架构校验通过"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/FNPIB.xcarchive/Products/Applications/FNPIB.app"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry FNPIB-unsigned.ipa Payload)
          ls -lh build/FNPIB-unsigned.ipa
          echo "== codesign（未签名包的正常输出）=="
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FNPIB-unsigned-ipa
          path: build/FNPIB-unsigned.ipa
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## FNPIB 未签名 IPA"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Xcode | `$(xcodebuild -version 2>/dev/null | tr '\n' ' ')` |"
            echo "| 产物大小 | `$(ls -l build/FNPIB-unsigned.ipa 2>/dev/null | awk '{print $5}' || echo n/a)` |"
          } >> "$GITHUB_STEP_SUMMARY"
